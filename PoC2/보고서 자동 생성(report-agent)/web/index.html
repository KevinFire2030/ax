<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AX 보고서 자동 생성 PoC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background:#f6f7fb; }
    .card { border-radius: 14px; }
    textarea { min-height: 220px; }
    pre { white-space: pre-wrap; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="m-0">AX 보고서 자동 생성 PoC</h3>
      <div class="text-muted small">(웹 데모)</div>
    </div>

    <div class="row g-3">
      <div class="col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <label class="form-label">제목/키워드</label>
            <input id="title" class="form-control" placeholder="예) MWC 2026 AI..." />

            <label class="form-label mt-3">링크(URL)</label>
            <input id="url" class="form-control" placeholder="https://..." />

            <label class="form-label mt-3">기사 본문 붙여넣기(옵션, 링크 수집 실패 대비)</label>
            <textarea id="body" class="form-control" placeholder="URL 수집이 막히면 여기에 기사 본문을 붙여넣으세요."></textarea>

            <div class="d-flex gap-2 mt-3">
              <button id="btn_generate" class="btn btn-primary">보고서 생성</button>
              <button id="btn_clear" class="btn btn-outline-secondary">초기화</button>
              <div class="ms-auto small text-muted" id="status"></div>
            </div>

            <div class="alert alert-secondary small mt-3 mb-0">
              생성 로직은 <b>기존 보고서(샘플 13개 → 추후 300개)</b>에서 유사 스타일을 찾아
              AX 규칙(섹션 순서/불릿 문체)을 유지하며 초안을 생성합니다.
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <h6 class="mb-2">1) 유사 보고서 Top-K (형식/톤 선택 근거)</h6>
            <div id="retrieval" class="small text-muted">아직 없음</div>
          </div>
        </div>

        <div class="card shadow-sm mt-3">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <h6 class="mb-2">2) 보고서 초안(미리보기)</h6>
              <div class="d-flex gap-2">
                <a id="download" class="btn btn-sm btn-success disabled" href="#">DOCX 다운로드</a>
              </div>
            </div>
            <div id="report" class="small text-muted">아직 없음</div>
          </div>
        </div>

        <div class="card shadow-sm mt-3">
          <div class="card-body">
            <h6 class="mb-2">3) Raw JSON (디버그)</h6>
            <pre id="raw" class="mono small text-muted">아직 없음</pre>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  const el = (id) => document.getElementById(id);

  function setStatus(t) { el('status').textContent = t || ''; }
  function renderJson(id, obj) {
    el(id).textContent = JSON.stringify(obj, null, 2);
  }

  el('btn_clear').addEventListener('click', () => {
    el('title').value = '';
    el('url').value = '';
    el('body').value = '';
    el('retrieval').innerHTML = '아직 없음';
    el('report').innerHTML = '아직 없음';
    el('raw').textContent = '아직 없음';
    el('download').classList.add('disabled');
    el('download').setAttribute('href', '#');
  });

  el('btn_generate').addEventListener('click', async () => {
    setStatus('생성 중...');
    try {
      const payload = {
        title: el('title').value,
        url: el('url').value,
        pasted_body: el('body').value
      };

      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const obj = await res.json();

      if (!obj.ok) {
        el('retrieval').innerHTML = '<span class="text-danger">에러: ' + (obj.error || 'unknown') + '</span>';
        renderJson('raw', obj);
        return;
      }

      // Retrieval
      const items = obj.retrieval || [];
      el('retrieval').innerHTML = items.map((x) => {
        return `<div>• <b>${x.title}</b> <span class="text-muted">(score=${x.score.toFixed(3)})</span></div>`;
      }).join('') || '없음';

      // Report preview (simple)
      const r = obj.report || {};
      const html = `
        <div class="mb-2"><b>${r.report_title || ''}</b></div>
        <div class="mb-2"><b>소제목①</b> ${r.headline_one_liner || ''}</div>
        <div class="mb-2">${(r.section1_summary_bullets||[]).map(b=>`- ${b}`).join('<br/>')}</div>
        <div class="mb-2"><b>소제목②: 추가 확인 사항</b></div>
        <div class="mb-2">${(r.section2_additional_checks_bullets||[]).map(b=>`- ${b}`).join('<br/>')}</div>
        <div class="mb-2"><b>주요 인사이트(시사점)</b></div>
        <div class="mb-2">${(r.insights_bullets||[]).map(b=>`- ${b}`).join('<br/>')}</div>
        <div class="mb-2"><b>별첨</b></div>
        <div class="mb-1"><b>회사</b></div>
        <div class="mb-2">${((r.appendix||{}).companies||[]).map(c=>`• ${c.name}<br/>${(c.overview_bullets||[]).map(b=>`- ${b}`).join('<br/>')}`).join('<br/><br/>') || '(없음)'}</div>
        <div class="mb-1"><b>인물</b></div>
        <div class="mb-2">${((r.appendix||{}).people||[]).map(p=>`• ${p.name}<br/>${(p.profile_bullets||[]).map(b=>`- ${b}`).join('<br/>')}`).join('<br/><br/>') || '(없음)'}</div>
      `;
      el('report').innerHTML = html;

      renderJson('raw', obj);

      // download
      if (obj.download_url) {
        el('download').classList.remove('disabled');
        el('download').setAttribute('href', obj.download_url);
      }

    } catch (e) {
      el('retrieval').innerHTML = '<span class="text-danger">에러: ' + String(e) + '</span>';
    } finally {
      setStatus('');
    }
  });
</script>
</body>
</html>
